# gradle.properties — Project-wide Gradle settings.

# AndroidX is required for all modern Android libraries (Compose, WorkManager, etc.)
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Increases the JVM heap size for the Gradle daemon.
# Needed for C++ compilation via NDK.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

# Enable Gradle configuration cache for faster incremental builds.
org.gradle.configuration-cache=false

# Enable parallel builds
org.gradle.parallel=true

# Non-transitive R classes — recommended for new projects
android.nonTransitiveRClass=true
