# libs.versions.toml — Centralised dependency versions for the ALI Android app.
# All versions are pinned. Bump deliberately; do not use open ranges.

[versions]
agp                 = "8.6.1"
kotlin              = "2.0.21"
compose-bom         = "2024.10.01"
core-ktx            = "1.15.0"
lifecycle           = "2.8.7"
activity-compose    = "1.9.3"
coroutines          = "1.9.0"
work-runtime        = "2.10.0"
navigation-compose  = "2.8.3"

[libraries]
# AndroidX core
androidx-core-ktx               = { group = "androidx.core",         name = "core-ktx",                version.ref = "core-ktx" }
androidx-lifecycle-runtime-ktx  = { group = "androidx.lifecycle",    name = "lifecycle-runtime-ktx",   version.ref = "lifecycle" }
androidx-lifecycle-viewmodel    = { group = "androidx.lifecycle",    name = "lifecycle-viewmodel-ktx",  version.ref = "lifecycle" }
androidx-activity-compose       = { group = "androidx.activity",     name = "activity-compose",         version.ref = "activity-compose" }
androidx-work-runtime-ktx       = { group = "androidx.work",         name = "work-runtime-ktx",         version.ref = "work-runtime" }
androidx-navigation-compose     = { group = "androidx.navigation",   name = "navigation-compose",       version.ref = "navigation-compose" }

# Compose BOM — pins all Compose library versions together
compose-bom                     = { group = "androidx.compose",      name = "compose-bom",              version.ref = "compose-bom" }
compose-ui                      = { group = "androidx.compose.ui",   name = "ui" }
compose-ui-tooling-preview      = { group = "androidx.compose.ui",   name = "ui-tooling-preview" }
compose-ui-tooling              = { group = "androidx.compose.ui",   name = "ui-tooling" }
compose-material3               = { group = "androidx.compose.material3", name = "material3" }
compose-foundation              = { group = "androidx.compose.foundation", name = "foundation" }

# Coroutines
kotlinx-coroutines-android      = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
